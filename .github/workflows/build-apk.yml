name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Thêm quyền GPS + Camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $M
          grep -n "uses-permission" $M

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Lưu APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: cuahang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Đăng APK lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bản build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
