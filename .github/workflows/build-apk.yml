name: Build APK + Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 1. Build file APK cho Android =====
  apk:
    runs-on: ubuntu-latest
    env:
      APP_NAME: "Tìm cửa hàng"   # Tên hiện dưới biểu tượng + trong Cài đặt > Ứng dụng
      VERSION_BASE: "1.0"        # Phiên bản = 1.0.<số lần build>, ví dụ 1.0.12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Thêm plugin tự bật GPS (hộp thoại Google)
        run: |
          D=android/app/src/main/java/com/cuahang/tim
          mkdir -p $D
          cp native/*.java $D/
          sed -i '/^dependencies {/a\    implementation "com.google.android.gms:play-services-location:21.3.0"' android/app/build.gradle
          grep -n "play-services-location" android/app/build.gradle

      - name: Thêm quyền GPS + Camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $M
          grep -n "uses-permission" $M

      - name: Đặt tên app + số phiên bản
        run: |
          VER="${VERSION_BASE}.${{ github.run_number }}"
          S=android/app/src/main/res/values/strings.xml
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|" $S
          sed -i "s|<string name=\"title_activity_main\">[^<]*</string>|<string name=\"title_activity_main\">${APP_NAME}</string>|" $S
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VER}\"/" $G
          grep -n "app_name\|title_activity_main" $S || true
          grep -n "versionCode\|versionName" $G || true
          # đồng bộ số phiên bản vào trang "Thông tin" trong app (không có thì chỉ cảnh báo, không làm hỏng build)
          if [ -f www/index.html ]; then
            sed -i "s/version:'[0-9][0-9.]*'/version:'${VER}'/" www/index.html
            grep -n "version:'" www/index.html || echo "CẢNH BÁO: www/index.html không có dòng version:'...' nên không cập nhật được số phiên bản trong app"
          else
            echo "CẢNH BÁO: không tìm thấy www/index.html"
          fi

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Lưu APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: cuahang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Đăng APK lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bản build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

  # ===== 2. Đăng bản web lên GitHub Pages (có link https) =====
  web:
    runs-on: ubuntu-latest
    continue-on-error: true   # repo private không có Pages thì bỏ qua, APK vẫn build bình thường
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
