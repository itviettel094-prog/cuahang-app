name: Build APK + Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 1. Build file APK cho Android =====
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Thay icon app
        run: |
          R=android/app/src/main/res
          find $R -name 'ic_launcher*.webp' -delete
          cp -r app-icons/* $R/
          rm -f $R/drawable-v24/ic_launcher_foreground.xml
          rm -f $R/drawable/ic_launcher_background.xml
          ls $R/mipmap-xxxhdpi

      - name: Thêm plugin tự bật GPS (hộp thoại Google)
        run: |
          D=android/app/src/main/java/com/cuahang/tim
          mkdir -p $D
          cp native/*.java $D/
          sed -i '/^dependencies {/a\    implementation "com.google.android.gms:play-services-location:21.3.0"' android/app/build.gradle
          grep -n "play-services-location" android/app/build.gradle

      - name: Thêm quyền GPS + Camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $M
          grep -n "uses-permission" $M

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Chỉnh Gradle (chọn nguồn tải còn sống + tăng thời gian chờ)
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          V=8.2.1
          URL=""
          for U in \
            "https://services.gradle.org/distributions/gradle-$V-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-$V-bin.zip"; do
            echo "Thử: $U"
            if curl -fsIL --max-time 30 "$U" -o /dev/null; then URL="$U"; echo "-> dùng nguồn này"; break; fi
          done
          if [ -z "$URL" ]; then
            URL="https://services.gradle.org/distributions/gradle-$V-bin.zip"
            echo "Không nguồn nào trả lời, dùng nguồn mặc định"
          fi
          ESC=$(echo "$URL" | sed 's|:|\\:|')
          sed -i "s|^distributionUrl=.*|distributionUrl=$ESC|" $P
          sed -i '/^networkTimeout=/d' $P
          echo "networkTimeout=120000" >> $P
          cat $P

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            echo "=== Lần build $i ==="
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Lỗi, chờ 45 giây rồi thử lại..."
            sleep 45
          done
          echo "Build thất bại sau 3 lần thử"
          exit 1

      - name: Lưu APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: cuahang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Đăng APK lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bản build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

  # ===== 2. Đăng bản web lên GitHub Pages (có link https) =====
  web:
    runs-on: ubuntu-latest
    continue-on-error: true   # repo private không có Pages thì bỏ qua, APK vẫn build bình thường
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
