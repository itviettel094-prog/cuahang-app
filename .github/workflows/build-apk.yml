name: Build APK + Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 1. Build file APK cho Android =====
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: 17

      - name: Kiểm tra Node và Java
        run: |
          node -v
          npm -v
          if [ -n "$JAVA_HOME_17_X64" ]; then echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV; fi
          java -version

      - name: Cài thư viện
        run: |
          npm install
          npm install @capacitor-community/contacts

      - name: Cài plugin cập nhật từ xa (Capgo Updater)
        run: |
          MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor major: $MAJOR"
          npm install @capgo/capacitor-updater@$MAJOR || npm install @capgo/capacitor-updater
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.plugins=c.plugins||{};c.plugins.CapacitorUpdater={autoUpdate:false};fs.writeFileSync(f,JSON.stringify(c,null,2));"
          cat capacitor.config.json

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Thay icon app
        run: |
          R=android/app/src/main/res
          find $R -name 'ic_launcher*.webp' -delete
          SRC=app-icons
          [ -d app-icons/app-icons ] && SRC=app-icons/app-icons
          echo "Lấy icon từ: $SRC"; ls $SRC
          cp -r $SRC/* $R/
          rm -rf $R/app-icons
          if [ ! -d "$SRC/mipmap-anydpi-v26" ]; then rm -rf $R/mipmap-anydpi-v26; fi
          ls $R/mipmap-*/ic_launcher*.png >/dev/null 2>&1 || { echo "KHÔNG THẤY ic_launcher*.png trong $SRC, kiểm tra lại thư mục app-icons"; exit 1; }
          rm -f $R/drawable-v24/ic_launcher_foreground.xml
          rm -f $R/drawable/ic_launcher_background.xml
          ls $R/mipmap-xxxhdpi

      - name: Thêm plugin tự bật GPS (hộp thoại Google)
        run: |
          D=android/app/src/main/java/com/cuahang/tim
          mkdir -p $D
          cp native/*.java $D/
          sed -i '/^dependencies {/a\    implementation "com.google.android.gms:play-services-location:21.3.0"' android/app/build.gradle
          grep -n "play-services-location" android/app/build.gradle

      - name: Thêm quyền GPS + Camera + Danh bạ + Nhật ký cuộc gọi
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n    <uses-permission android:name="android.permission.READ_CALL_LOG" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $M
          grep -n "uses-permission" $M

      - name: Nâng compileSdk lên 35 và minSdk lên 23 (plugin cập nhật yêu cầu)
        run: |
          V=android/variables.gradle
          cat $V
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' $V
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' $V
          grep -q "android.suppressUnsupportedCompileSdk" android/gradle.properties || echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          grep -n "compileSdkVersion\|targetSdkVersion\|minSdkVersion" $V
          tail -3 android/gradle.properties

      - name: Gắn địa chỉ cập nhật vào app
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY##*/}"
          VER="1.0.${{ github.run_number }}"
          sed -i "s|__UPDATE_BASE__|https://$OWNER.github.io/$REPO|g; s|__BUILD_VER__|$VER|g" www/index.html
          grep -n "https://$OWNER.github.io" www/index.html | head -2

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Tải Gradle thủ công (thử nhiều nguồn) + chỉnh wrapper
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          V=8.2.1
          F=/tmp/gradle-$V-bin.zip
          OK=0
          for U in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-$V-bin.zip" \
            "https://services.gradle.org/distributions/gradle-$V-bin.zip"; do
            echo "=== Tải: $U"
            rm -f $F
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 300 -o $F "$U" && unzip -tq $F >/dev/null 2>&1; then
              echo "-> Tải xong và file zip hợp lệ"; OK=1; break
            fi
            echo "-> Nguồn này lỗi, thử nguồn tiếp theo"
          done
          if [ "$OK" != "1" ]; then echo "KHÔNG TẢI ĐƯỢC GRADLE từ nguồn nào, hãy chạy lại sau ít phút"; exit 1; fi
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\\\:$F|" $P
          sed -i '/^networkTimeout=/d' $P
          echo "networkTimeout=120000" >> $P
          cat $P

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            echo "=== Lần build $i ==="
            ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
            [ "${PIPESTATUS[0]}" = "0" ] && exit 0
            if grep -qiE "timed out|timeout|HTTP response code: 5|Connection reset|Could not GET|Could not resolve|Could not download|Read timed out" /tmp/build.log; then
              echo "Lỗi mạng, chờ 45 giây rồi thử lại..."
              sleep 45
            else
              echo "Lỗi cấu hình/biên dịch (không phải lỗi mạng), dừng ngay. Xem dòng 'What went wrong' ở trên."
              exit 1
            fi
          done
          echo "Build thất bại sau 3 lần thử"
          exit 1

      - name: Lưu APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: cuahang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Đăng APK lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bản build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

  # ===== 2. Đăng bản web lên GitHub Pages (có link https) =====
  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Tạo gói cập nhật từ xa (bundle.zip + version.json)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY##*/}"
          VER="1.0.${{ github.run_number }}"
          sed -i "s|__UPDATE_BASE__|https://$OWNER.github.io/$REPO|g; s|__BUILD_VER__|$VER|g" www/index.html
          mkdir site
          cp -r www/. site/
          (cd www && zip -qr ../site/bundle-$VER.zip .)
          echo "{\"version\":\"$VER\",\"file\":\"bundle-$VER.zip\"}" > site/version.json
          cat site/version.json
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
